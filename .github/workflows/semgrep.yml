name: Semgrep Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Semgrep
        run: pip install semgrep
        
      - name: Run Semgrep
        run: semgrep --config yaml/timing-vuln.yaml --config yaml/ip-block-bypass.yaml --config yaml/2fa_bypass.yml --config yaml/idor_func.yaml .
